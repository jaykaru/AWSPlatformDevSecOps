stages:
  - fmt
  - lint
  - validate
  - security
  - plan

workflow:
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_PIPELINE_SOURCE == "push" && $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH'
    - when: never

variables:
  TF_ROOT: terraform  # Terraform root directory re use 
  TF_IN_AUTOMATION: "true" # Terraform knows it is running inside CI/CD not locally

default:
  image:
    name: hashicorp/terraform:1.14.0 # Use the specified Terraform Docker image for the CI jobs
    entrypoint: [""] # Override the default entrypoint to allow GitLab CI to run Terraform commands directly
  cache:
    key:
      files:
        - terraform/.terraform.lock.hcl
    paths:
      - terraform/.terraform/providers

terraform_fmt:
  stage: fmt
  script:
    - cd "$TF_ROOT"
    - terraform fmt -check -recursive

terraform_lint:
  stage: lint
  image:
    name: ghcr.io/terraform-linters/tflint:v0.59.1
    entrypoint: [""]
  needs: ["terraform_fmt"]
  script:
    - cd "$TF_ROOT"
    - tflint --init
    - tflint --recursive

terraform_validate:
  stage: validate
  needs: ["terraform_lint"]
  script:
    - cd "$TF_ROOT"
    - terraform init -backend=false -input=false
    - terraform validate

terraform_checkov:
  stage: security
  image:
    name: bridgecrew/checkov:3.2.372
    entrypoint: [""]
  needs: ["terraform_validate"]
  script:
    - checkov -d "$TF_ROOT" --framework terraform

terraform_plan:
  stage: plan
  needs: ["terraform_checkov"]
  script:
    - cd "$TF_ROOT"
    - terraform init -backend=false -input=false
    - terraform plan -out=tfplan
    - terraform show -no-color tfplan > tfplan.txt
  artifacts:
    paths:
      - $TF_ROOT/tfplan
      - $TF_ROOT/tfplan.txt
    expire_in: 1 week

  
